[project]
name = "triagerag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "drain3",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "pgvector>=0.5.0",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sentence-transformers>=6.1.0",
    "torch",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triagerag"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Linux (the Docker image) gets CPU-only torch: the embedder runs on CPU, and the default
# wheels pull several GB of CUDA libraries. macOS keeps the PyPI build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
